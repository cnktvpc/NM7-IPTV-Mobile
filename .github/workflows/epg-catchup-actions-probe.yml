name: NM7 EPG Actions Probe
on:
  push:
    branches:
      - "feature/epg-catchup-superok-20261028"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm GitHub-hosted runner starts
        run: |
          set -euxo pipefail
          echo "NM7 EPG branch runner probe"
          echo "Ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
