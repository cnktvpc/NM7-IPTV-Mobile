<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0">
    <title>Nm7 IPTV</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
<div id="app">
    <section id="home" class="screen active">
        <header>
            <div class="brand"><span class="logo-mark">▶</span><span>Nm7 IPTV</span></div>
            <div class="header-actions">
                <button id="sourcesButton" class="focusable">☰ Link</button>
                <button id="addButton" class="focusable primary">+ Nguồn</button>
                <button id="settingsButton" class="focusable">⚙ Cài đặt</button>
            </div>
        </header>
        <nav id="sections">
            <button data-section="all" class="focusable active">Tất cả</button>
            <button data-section="favorites" class="focusable">★ Yêu thích</button>
            <button data-section="recent" class="focusable">◷ Gần đây</button>
        </nav>
        <div class="search-row">
            <input id="searchInput" class="focusable" placeholder="Tìm kênh hoặc nhóm…">
            <button id="clearButton" class="focusable">Bỏ lọc</button>
        </div>
        <div id="groups" class="groups"></div>
        <div id="loading" class="loading hidden">Đang tải danh sách kênh…</div>
        <div id="empty" class="empty hidden">Không tìm thấy kênh</div>
        <div id="channelGrid" class="channel-grid"></div>
    </section>

    <section id="playerScreen" class="screen player-screen">
        <object id="avPlayer" type="application/avplayer"></object>
        <div id="playerShade"></div>
        <div id="playerOverlay">
            <div class="player-top">
                <button id="playerBack" class="focusable">‹</button>
                <div><h1 id="playerTitle">Kênh</h1><div id="playerStatus">Đang mở…</div></div>
                <div id="clock"></div>
            </div>
            <div class="player-help">OK: Ẩn/hiện điều khiển &nbsp; • &nbsp; ↑↓: Đổi kênh &nbsp; • &nbsp; ←: Danh sách nhanh</div>
        </div>
        <aside id="quickPanel" class="quick-panel hidden"><h2>Kênh</h2><div id="quickList"></div></aside>
        <div id="playerError" class="dialog hidden"><h2>Không phát được kênh</h2><p id="playerErrorText"></p><button id="retryButton" class="focusable primary">Thử lại</button></div>
    </section>

    <div id="sourceDialog" class="dialog hidden">
        <h2>Thêm nguồn IPTV</h2>
        <input id="sourceInput" class="focusable" placeholder="Nhập URL playlist M3U">
        <div class="dialog-actions"><button id="loadButton" class="focusable primary">Tải URL</button><button id="cancelSource" class="focusable">Đóng</button></div>
    </div>
    <div id="sourcesDialog" class="dialog hidden"><h2>Nguồn IPTV</h2><div id="sourceList"></div><button id="closeSources" class="focusable">Đóng</button></div>
    <div id="settingsDialog" class="dialog hidden">
        <h2>Cài đặt</h2>
        <button id="toggleUrls" class="focusable">Hiện URL trong danh sách</button>
        <button id="clearRecent" class="focusable">Xóa lịch sử Gần đây</button>
        <button id="aboutButton" class="focusable">Thông tin ứng dụng</button>
        <button id="closeSettings" class="focusable">Đóng</button>
    </div>
    <div id="toast"></div>
</div>
<script src="js/m3u.js"></script>
<script src="js/app.js"></script>
</body>
</html>
